name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build (native + linux/amd64)
        run: make build-all

      - name: Tests (unit + integration + CLI smoke)
        run: make test
